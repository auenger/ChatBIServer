function render(){if(!navItems.some(n=>n[0]===view))view='overview';document.getElementById('nav').innerHTML=navItems.map(([id,name,ic],i)=>`<button data-action="navigate" data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(ic)}${name}<span class="number">${i===6?'4':String(i).padStart(2,'0')}</span></button>`).join('');document.getElementById('breadcrumb').textContent=navItems.find(n=>n[0]===view)[1];document.getElementById('main').innerHTML=({overview,clients,model,subjects,policies,verify,discussion}[view])()+`<footer class="tagline">MEPER · 通用权限模型讨论原型 v0.1 <span style="margin:0 8px">/</span> 所有数据与预检均为本地模拟</footer>`}
function navigate(target){view=target;location.hash=target;render();document.getElementById('shell').classList.remove('menu-open');document.getElementById('main').focus({preventScroll:true});window.scrollTo(0,0)}
function openDialog(title,body,footer){const d=document.getElementById('dialog');d.innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${title}</h2>${btn(icon('CloseOutlined'),'close-dialog','ghost small','aria-label="关闭对话框"')}</div><div class="dialogbody">${body}</div><div class="dialogfoot">${footer||btn('关闭','close-dialog')}</div>`;d.showModal()}
function closeDialog(){document.getElementById('dialog').close()}
function modelValid(m){if(!m.name.trim())return '请填写模型名称。';if(m.external!==F().external)return '当前匹配键在示例目录中无法命中外部 user-001。';if(m.entities.length>2||m.relations.length>1)return '自定义实体/关系已保留在草稿中；演示解析器暂不支持发布这些扩展。';return ''}
function publishDialog(kind){const a=A()[kind],isModel=kind==='model';let errors=isModel?modelValid(a.draft):(!a.draft.name.trim()?'请填写策略名称。':(!Number.isInteger(a.draft.maxRows)||a.draft.maxRows<1||a.draft.maxRows>200?'行数须为 1–200 的整数。':''));if(errors){toast(errors);return}const summary=x=>isModel?`名称：${x.name}\n主体键：${x.pk}\n匹配键：${x.external}\n组织属性：${x.org||'未映射'}`:`SELECT：${x.allow?'允许':'拒绝'}\n主体：${x.subjectType}:${x.subject}\n可读字段：${Object.entries(x.fields).filter(([k,v])=>v.read).map(([k])=>k).join(', ')||'空集合（拒绝）'}\n可筛选：${Object.entries(x.fields).filter(([k,v])=>v.filter).map(([k])=>k).join(', ')||'无'}\n脱敏：${Object.entries(x.fields).filter(([k,v])=>v.mask).map(([k])=>k).join(', ')||'无'}\n行范围：${{own:'本人',org:'组织',all:'无附加限制'}[x.row]}\n资源字段：${x.rowField}\n主体属性：${x.subjectAttr}\n行数：${x.maxRows}`;openDialog('确认发布'+(isModel?'身份模型':'数据策略'),`<div class="notice warn">仅更新本地演示正式版本。发布后，旧预检结果失效，需要重新运行。</div><div class="review-grid section-gap"><div><strong>当前正式版 v${a.revision}</strong>${esc(summary(a.published))}</div><div><strong>待发布 v${a.revision+1}</strong>${esc(summary(a.draft))}</div></div>`,btn('返回编辑','close-dialog')+btn('确认发布','confirm-publish','primary','data-kind="'+kind+'"'))}
function exportData(){const payload={prototype:'MEPER 通用权限工作台',version:'0.1',exportedAt:new Date().toISOString(),notice:'纯前端讨论数据；非生产策略配置，不代表已确认合同。',configuration:state.apps,discussion:questions.map(q=>({question:q.title,tendency:state.choices[q.key]||'未选择',note:state.notes[q.key]||''})),localAudit:state.audit};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meper-permission-discussion.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出示例配置与讨论备注')}
let clientEdits={};
function addEntity(){openDialog('添加身份实体',`<p class="tiny muted" style="margin-bottom:16px">用于讨论模型表达。扩展实体可保存与导出，尚未接入本原型解析器。</p><div class="formgrid">${field('业务名称','<input id="entity-name" placeholder="例如：项目成员">')}${field('逻辑类型',select('entity-type',[['GROUP','GROUP · 用户组'],['ORG_UNIT','ORG_UNIT · 组织'],['CUSTOM','CUSTOM · 自定义实体']],'GROUP'))}${field('物理表','<input id="entity-table" placeholder="例如：project_member">')}${field('主键字段','<input id="entity-key" placeholder="例如：member_id">')}</div><div id="dialog-error" class="form-error" role="alert"></div>`,btn('取消','close-dialog')+btn('加入模型草稿','confirm-entity','primary'))}
function addRelation(){let types=A().model.draft.entities.map(e=>[e.type,e.name+' · '+e.type]);openDialog('添加关系路径',`<p class="tiny muted" style="margin-bottom:16px">显式指定实体与字段，不根据表名推断关系。本原型不执行这条新增路径。</p><div class="formgrid">${field('关系名称','<input id="relation-name" placeholder="例如：MEMBER_OF">')}${field('关联表','<input id="relation-table" placeholder="例如：user_group">')}${field('源实体',select('relation-from',types,'USER'))}${field('目标实体',select('relation-to',types,types[types.length-1][0]))}${field('源键字段','<input id="relation-fromKey" placeholder="例如：user_id">')}${field('目标键字段','<input id="relation-toKey" placeholder="例如：group_id">')}</div><div id="dialog-error" class="form-error" role="alert"></div>`,btn('取消','close-dialog')+btn('加入模型草稿','confirm-relation','primary'))}
function refreshFooter(kind){const footer=document.querySelector('#main .foot-actions');if(footer)footer.outerHTML=changesFooter(kind)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
 if(action==='navigate')return navigate(b.dataset.view);
 if(action.startsWith('go-'))return navigate(action.slice(3));
 if(action==='close-dialog')return closeDialog();
 if(action==='export')return exportData();
 if(action==='scenario'){state.app=b.dataset.app;subject='user-001';mapPreview=null;lastResult=null;persist();return navigate('model')}
 if(action==='test-model'){const err=modelValid(A().model.draft);mapPreview={ok:!err,message:err||'已从示例目录解析业务键、角色和可选属性。此结果基于当前草稿，不验证真实数据库。'};return render()}
 if(action==='revert-model'||action==='revert-policy'){const k=action.slice(7);A()[k].draft=clone(A()[k].published);mapPreview=null;persist();render();return toast('已恢复为正式版配置')}
 if(action==='save-model'||action==='save-policy'){persist();audit('保存草稿',action==='save-model'?'身份模型草稿已保存；正式版不变':'数据策略草稿已保存；正式版不变');return toast('草稿已保存；尚未发布生效')}
 if(action==='save-client'){let c=clientEdits[state.app]||A().client;if(!c.issuer.trim()||!c.audience.trim()||!Number.isInteger(c.ttl)||c.ttl<30||c.ttl>600)return toast('请填写签发方、受众，时效上限须为 30–600 的整数。');A().client=clone(c);delete clientEdits[state.app];lastResult=null;audit('保存接入配置','本地演示客户端配置已更新');render();return toast('接入配置已保存，旧预检结果已清空')}
 if(action==='publish-model'||action==='publish-policy')return publishDialog(action.slice(8));
 if(action==='confirm-publish'){let k=b.dataset.kind;A()[k].published=clone(A()[k].draft);A()[k].revision++;lastResult=null;audit('发布'+(k==='model'?'身份模型':'数据策略'),'正式版本 v'+A()[k].revision);closeDialog();render();return toast('已发布本地正式版；请重新运行权限预检')}
 if(action==='select-subject'){subject=b.dataset.sub;return render()}
 if(action==='subject-verify'){lastResult=null;return navigate('verify')}
 if(action==='run'){b.disabled=true;b.textContent='正在计算示例…';const captured=state.app;setTimeout(()=>{if(state.app!==captured)return;lastResult=compute();resultTab='summary';audit('模拟权限预检',lastResult.code+' · '+subject);render();document.getElementById('result-panel')?.setAttribute('aria-live','polite');toast(lastResult.ok?'模拟预检完成：允许读取':'模拟预检完成：访问被拒绝')},240);return}
 if(action==='result-tab'){resultTab=b.dataset.tab;document.getElementById('result-panel').innerHTML=renderResult();return}
 if(action==='try-unassigned'){subject='user-003';lastResult=null;return render()}
 if(action==='try-revoke'){verifySettings.scenario='external';lastResult=null;return render()}
 if(action==='discussion-policy'){navigate('discussion');return document.querySelector('[data-key="merge"]')?.focus()}
 if(action==='choice'){state.choices[b.dataset.key]=b.dataset.value;persist();return render()}
 if(action==='reset'){return openDialog('重置本地演示？','<p>清除当前浏览器中的示例配置、草稿和讨论备注，恢复初始 CRM / ERP 夹具。可先导出讨论稿。</p>',btn('取消','close-dialog')+btn('重置演示','confirm-reset','primary'))}
 if(action==='confirm-reset'){state=initial();clientEdits={};lastResult=null;mapPreview=null;subject='user-001';verifySettings={scenario:'valid',query:'star',scope:'all'};filter='';persist();closeDialog();render();return toast('已恢复初始演示')}
 if(action==='assertion'){return openDialog('可信接入 · 请求示例',`<p class="tiny muted" style="margin-bottom:16px">以下为协议结构讨论，不含有效签名或可使用的凭据。平台隔离域由可信接入配置决定。</p><pre>${esc(JSON.stringify({clientId:F().code,assertion:{iss:F().issuer,aud:'meper-data-gateway',sub:'user-001',exp:'短期到期时间',jti:'一次性请求标识'},accessModel:state.app+'-identity-v'+A().model.revision,permissionDomain:F().domain},null,2))}</pre><div class="notice section-gap">服务凭证验证与身份断言验证分别完成；角色属性只使用配置允许的可信来源。</div>`)}
 if(action==='add-entity')return addEntity();
 if(action==='add-relation')return addRelation();
 if(action==='confirm-entity'){const get=id=>document.getElementById('entity-'+id).value.trim();let x={name:get('name'),type:get('type'),table:get('table'),key:get('key')};if(!x.name||!/^[A-Za-z_][\w.]*$/.test(x.table)||!/^[A-Za-z_]\w*$/.test(x.key)){document.getElementById('dialog-error').textContent='请填写实体名称及有效的示例表名、键字段。';return}A().model.draft.entities.push(x);persist();closeDialog();mapPreview=null;render();return toast('实体已加入草稿；扩展路径尚未参与权限计算')}
 if(action==='confirm-relation'){let x={};for(const k of ['name','table','from','to','fromKey','toKey'])x[k]=document.getElementById('relation-'+k).value.trim();if(Object.values(x).some(v=>!v)||!['name','table','fromKey','toKey'].every(k=>/^[A-Za-z_][\w.]*$/.test(x[k]))){document.getElementById('dialog-error').textContent='请完整填写关系名称、实体、表与关联键。';return}A().model.draft.relations.push(x);persist();closeDialog();mapPreview=null;render();return toast('关系已加入草稿；可导出讨论，暂不参与模拟解析')}
});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.note){state.notes[el.dataset.note]=el.value;persist()}if(el.id==='subject-search'){filter=el.value;const start=el.selectionStart;render();let n=document.getElementById('subject-search');n.focus();n.setSelectionRange(start,start)}if(el.dataset.model&&el.tagName==='INPUT'){A().model.draft[el.dataset.model]=el.value;mapPreview=null;persist();refreshFooter('model')}if(el.dataset.policy&&el.tagName==='INPUT'&&el.type!=='checkbox'){A().policy.draft[el.dataset.policy]=el.type==='number'?Number(el.value):el.value;persist();refreshFooter('policy')}if(el.dataset.client&&el.tagName==='INPUT'&&el.type!=='checkbox'){clientEdits[state.app]??=clone(A().client);clientEdits[state.app][el.dataset.client]=el.type==='number'?Number(el.value):el.value}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='app-select'){state.app=el.value;subject='user-001';lastResult=null;mapPreview=null;filter='';persist();render();return}if(el.dataset.model&&el.tagName==='SELECT'){A().model.draft[el.dataset.model]=el.value;mapPreview=null;persist();render();return}if(el.dataset.policy&&(el.tagName==='SELECT'||el.type==='checkbox')){const k=el.dataset.policy;A().policy.draft[k]=el.type==='checkbox'?el.checked:el.value;if(k==='row'){A().policy.draft.rowField=el.value==='org'?F().orgColumn:F().owner;A().policy.draft.subjectAttr=el.value==='org'?'orgKeys':'businessUserKey'}if(k==='subjectType')A().policy.draft.subject=el.value==='ROLE'?F().role:F().memberKey;persist();render();return}if(el.dataset.column){const f=A().policy.draft.fields[el.dataset.column];f[el.dataset.cap]=el.checked;if(el.dataset.cap==='mask'&&el.checked)f.filter=false;persist();render();return}if(el.dataset.client&&(el.tagName==='SELECT'||el.type==='checkbox')){clientEdits[state.app]??=clone(A().client);clientEdits[state.app][el.dataset.client]=el.type==='checkbox'?el.checked:el.value;return}if(el.id==='verify-subject'){subject=el.value;lastResult=null;render();return}if(el.id.startsWith('verify-')){verifySettings[el.id.slice(7)]=el.value;lastResult=null;render()}});
document.getElementById('export').addEventListener('click',exportData);document.getElementById('menu').addEventListener('click',()=>document.getElementById('shell').classList.toggle('menu-open'));
window.addEventListener('hashchange',()=>{view=location.hash.slice(1);render()});document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
render();
</script>
</body></html>
